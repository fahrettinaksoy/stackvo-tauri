# Extra FrankenPHP directives, added to every generated site block.
#
# What you write here lands inside the `:80 { }` block, after the managed
# directives. Comments and blank lines are dropped, so a file left like this
# changes nothing at all.
#
# FrankenPHP is Caddy with PHP embedded, so this is Caddy's grammar — but it
# is a separate file from caddy.conf on purpose. FrankenPHP serves PHP itself
# through `php_server`; there is no FPM behind it, so a `php_fastcgi`
# directive belongs in caddy.conf and means nothing here.
#
# `{{ VAR }}` is substituted from .env before the file is written.
#
# Examples:
#
#   encode gzip
#   header X-Stack "{{ DEFAULT_TLD_SUFFIX }}"
#
#   handle /healthz {
#       respond "ok" 200
#   }
