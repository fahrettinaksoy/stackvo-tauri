# Extra Caddy directives, added to every generated site block.
#
# What you write here lands inside the `:80 { }` block, after the managed
# directives. Comments and blank lines are dropped, so a file left like this
# changes nothing at all.
#
# `{{ VAR }}` is substituted from .env before the file is written.
#
# Examples:
#
#   encode gzip
#   header X-Stack "{{ DEFAULT_TLD_SUFFIX }}"
