# Extra nginx directives, added to every generated vhost.
#
# What you write here lands inside the `server { }` block, after the managed
# directives and before the closing brace. Comments and blank lines are
# dropped, so a file left like this changes nothing at all.
#
# `{{ VAR }}` is substituted from .env before the file is written, with the
# same rules the rest of the templates use — an unknown name is left alone.
#
# Examples:
#
#   client_body_timeout 120s;
#   add_header X-Stack "{{ DEFAULT_TLD_SUFFIX }}" always;
#
#   location /healthz {
#       access_log off;
#       return 200 "ok\n";
#   }
