http:
  routers:
    traefik:
      rule: "Host(`traefik.stackvo.loc`)"
      entryPoints:
        - websecure
      service: api@internal
      tls: {}
    rabbitmq:
      rule: "Host(`rabbitmq.stackvo.loc`)"
      entryPoints:
        - websecure
      service: rabbitmq
      tls: {}
    mailpit:
      rule: "Host(`mailpit.stackvo.loc`)"
      entryPoints:
        - websecure
      service: mailpit
      tls: {}

  services:
    rabbitmq:
      loadBalancer:
        servers:
          - url: "http://stackvo-rabbitmq:15672"
    mailpit:
      loadBalancer:
        servers:
          - url: "http://stackvo-mailpit:8025"
