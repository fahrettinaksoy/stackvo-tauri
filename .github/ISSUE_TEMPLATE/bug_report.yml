name: Bug report
description: Something behaves differently than it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a security issue, please do not open an issue — see
        [SECURITY.md](../../SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations: { required: true }

  - type: input
    id: version
    attributes:
      label: StackVo Desktop version
      description: Settings → Updates shows it.
    validations: { required: true }

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Windows, Linux]
    validations: { required: true }

  - type: input
    id: engine
    attributes:
      label: Docker runtime
      description: Docker Desktop, Colima, OrbStack, plain engine — and its version.

  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        Settings → Diagnostics → Open folder, then attach the newest file.
        Password and token values are already masked, but do read it first.
      render: text
